bio: |
  Hochan Son is a distributed systems architect and site reliability engineer
  who builds data infrastructure, ML pipelines, and high-scale distributed
  systems, working the gap between GenAI/LLM research and the systems that run it
  in production. His graduate research at the UCLA Trustworthy AI Lab spans
  synthetic tabular data generation and agentic, intent-conditioned model
  selection. His background spans Adtech, entertainment, and enterprise — from
  MySpace and Hallmark Labs to Branch.io and ADP.

